<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">GenLayer Discord Contribution Monitor Structure</title>
  <desc id="desc">System structure showing Discord bot, backend, database, scheduled jobs, GenLayer evaluation, admin commands, and alerts.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d5dbe7; stroke-width: 2; rx: 8; }
      .box { fill: #ffffff; stroke: #2d3748; stroke-width: 2; rx: 8; }
      .primary { fill: #e7f0ff; stroke: #2f6feb; }
      .green { fill: #e8f7ed; stroke: #238636; }
      .orange { fill: #fff3df; stroke: #bc6c25; }
      .red { fill: #ffecec; stroke: #d1242f; }
      .purple { fill: #f0eaff; stroke: #6f42c1; }
      .gray { fill: #f3f4f6; stroke: #6b7280; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <text class="title" x="48" y="54">GenLayer Discord Contribution Monitor</text>
  <text class="subtitle" x="48" y="82">Bot monitors contribution, detects role risk, and uses GenLayer for subjective monthly evaluation.</text>

  <rect class="panel" x="40" y="120" width="310" height="600"/>
  <text class="label" x="64" y="152">Inputs</text>

  <rect class="box primary" x="64" y="180" width="250" height="76"/>
  <text class="label" x="84" y="208">Discord Activity</text>
  <text class="small" x="84" y="232">messages, project posts, roles</text>

  <rect class="box green" x="64" y="286" width="250" height="86"/>
  <text class="label" x="84" y="314">Official Winners</text>
  <text class="small" x="84" y="338">weekly contest mentions</text>
  <text class="small" x="84" y="358">rank and XP announcements</text>

  <rect class="box orange" x="64" y="402" width="250" height="86"/>
  <text class="label" x="84" y="430">Submitted Proofs</text>
  <text class="small" x="84" y="454">X links, builder proof</text>
  <text class="small" x="84" y="474">manual/admin review</text>

  <rect class="box gray" x="64" y="518" width="250" height="86"/>
  <text class="label" x="84" y="546">Admin Actions</text>
  <text class="small" x="84" y="570">bonus, review, commands</text>
  <text class="small" x="84" y="590">role decisions</text>

  <rect class="panel" x="420" y="120" width="420" height="600"/>
  <text class="label" x="444" y="152">Core System</text>

  <rect class="box primary" x="462" y="180" width="300" height="76"/>
  <text class="label" x="486" y="208">Discord Bot</text>
  <text class="small" x="486" y="232">event listener and slash commands</text>

  <rect class="box" x="462" y="288" width="300" height="86"/>
  <text class="label" x="486" y="316">Backend API</text>
  <text class="small" x="486" y="340">normalizes events and proof records</text>
  <text class="small" x="486" y="360">calls scoring and review flows</text>

  <rect class="box green" x="462" y="410" width="300" height="106"/>
  <text class="label" x="486" y="438">Scoring Jobs</text>
  <text class="small" x="486" y="462">daily meaningful messages</text>
  <text class="small" x="486" y="482">weekly post scoring</text>
  <text class="small" x="486" y="502">monthly role health</text>

  <rect class="box purple" x="462" y="556" width="300" height="86"/>
  <text class="label" x="486" y="584">Database</text>
  <text class="small" x="486" y="608">metrics, proofs, alerts</text>
  <text class="small" x="486" y="628">GenLayer evaluations</text>

  <rect class="panel" x="910" y="120" width="330" height="600"/>
  <text class="label" x="934" y="152">Decisions and Outputs</text>

  <rect class="box purple" x="946" y="180" width="250" height="96"/>
  <text class="label" x="966" y="208">GenLayer</text>
  <text class="small" x="966" y="232">quality, originality, focus</text>
  <text class="small" x="966" y="252">Nomi Singularity winner</text>

  <rect class="box red" x="946" y="320" width="250" height="96"/>
  <text class="label" x="966" y="348">Role Risk Alerts</text>
  <text class="small" x="966" y="372">Watch, Warning, Purge Risk</text>
  <text class="small" x="966" y="392">admin channel notifications</text>

  <rect class="box green" x="946" y="462" width="250" height="96"/>
  <text class="label" x="966" y="490">Reports</text>
  <text class="small" x="966" y="514">/role_health</text>
  <text class="small" x="966" y="534">/purge_risk</text>

  <rect class="box orange" x="946" y="602" width="250" height="76"/>
  <text class="label" x="966" y="630">Monthly Award</text>
  <text class="small" x="966" y="654">/nomi_singularity</text>

  <path class="arrow" d="M314 218 C370 218, 395 218, 462 218"/>
  <path class="arrow" d="M314 329 C370 329, 395 329, 462 329"/>
  <path class="arrow" d="M314 445 C370 445, 395 445, 462 330"/>
  <path class="arrow" d="M314 561 C370 561, 395 561, 462 330"/>

  <path class="arrow" d="M612 256 L612 288"/>
  <path class="arrow" d="M612 374 L612 410"/>
  <path class="arrow" d="M612 516 L612 556"/>

  <path class="arrow" d="M762 462 C855 462, 865 228, 946 228"/>
  <path class="arrow" d="M762 462 C850 462, 860 368, 946 368"/>
  <path class="arrow" d="M762 599 C850 599, 870 510, 946 510"/>
  <path class="arrow" d="M762 599 C850 599, 870 640, 946 640"/>
  <path class="arrow dash" d="M946 250 C885 285, 830 318, 762 330"/>

  <text class="tiny" x="48" y="770">Storage policy: store metrics and proof records by default; store excerpts only for project posts, rule flags, and GenLayer evaluations.</text>
  <text class="tiny" x="48" y="792">X policy: count submitted/approved posts first; avoid direct crawling unless official API access is available.</text>
</svg>

